version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: taskhub-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: taskhub
    volumes:
      - mongodb_data:/data/db
    networks:
      - taskhub-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./services/user-service
      dockerfile: dockerfile
    container_name: user-service
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/taskhub?authSource=admin
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taskhub-network
    restart: unless-stopped

  task-service:
    build:
      context: ./services/task-service
      dockerfile: dockerfile
    container_name: task-service
    ports:
      - "8001:8001"
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/taskhub?authSource=admin
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taskhub-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: dockerfile
    container_name: notification-service
    ports:
      - "8002:8002"
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017/taskhub?authSource=admin
      NODE_ENV: production
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - taskhub-network
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  taskhub-network:
    driver: bridge
